name: Refresh league data

on:
  # Start at 4:11am Eastern with 8:11am/noon catch-up runs. GitHub can delay
  # or drop scheduled runs; one Tuesday trigger has proved insufficient.
  # Unchanged data preserves timestamps, so retries do not cause redeploys.
  # Cron has no DST; split EDT/EST by month and avoid the busy hour boundary.
  schedule:
    - cron: "11 8,12,16 * 9,10 2"    # Sep-Oct — 4:11am, 8:11am, noon EDT
    - cron: "11 9,13,17 * 11,12 2"   # Nov-Dec — 4:11am, 8:11am, noon EST
    - cron: "11 9,13,17 * 1 2"       # Jan     — 4:11am, 8:11am, noon EST
  # Allow manual runs
  workflow_dispatch:
    inputs:
      year:
        description: "Override CURRENT_YEAR (active season)"
        required: false
      next_year:
        description: "Override NEXT_YEAR (next draft year for ADP)"
        required: false

permissions:
  contents: write

concurrency:
  group: league-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check refresh regressions
        run: python -m unittest discover -s tests -v

      - name: Run pipeline
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_YEAR: ${{ inputs.year }}
          NEXT_YEAR: ${{ inputs.next_year }}
        run: python -m pipeline.build

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh league data ($(date -u +%Y-%m-%d))"
            # A delayed run can start after another job has already pushed.
            git pull --rebase --autostash origin main
            git push
          fi
